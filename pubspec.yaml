name: auto_loop
description: "AutoLoop: porta avanti un piano di sviluppo un blocco alla volta con Codex CLI o Claude Code."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  desktop_drop: ^0.8.0
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.3
  local_notifier: ^0.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  window_manager: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/agents/
